name: LuCI ESLint

on:
  push:
    branches:
      - 'master'
      - 'dev'
      - 'personal/**'
    paths:
      - 'htdocs/luci-static/resources/**'
      - 'root/usr/share/luci/menu.d/**'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/eslint.yml'

  pull_request:
    branches:
      - 'master'
      - 'dev'
    paths:
      - 'htdocs/luci-static/resources/**'
      - 'root/usr/share/luci/menu.d/**'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/eslint.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source tree
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint:js
